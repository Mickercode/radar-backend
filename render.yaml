# Render blueprint for the Radar backend + its Postgres.
# Create via Render dashboard → "New +" → "Blueprint" pointed at this repo.
services:
  - type: web
    name: radar-api
    runtime: node
    plan: starter
    # db push syncs the schema (incl. the pgvector/pgcrypto extensions) directly —
    # the project has no migration history yet. Switch to `prisma migrate deploy`
    # once you start committing migrations (see RENDER_DEPLOY.md).
    buildCommand: npm install && npm run build && npx prisma db push --skip-generate
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: radar-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGIN
        value: '*'

databases:
  - name: radar-db
    plan: basic-256mb
    postgresMajorVersion: '16'
