# Render blueprint for the Radar backend + its Postgres.
# Create via Render dashboard → "New +" → "Blueprint" pointed at this repo.
services:
  - type: web
    name: radar-api
    runtime: node
    plan: starter
    # --include=dev: NODE_ENV=production makes npm skip devDependencies, but the
    # build needs TypeScript. This forces them in.
    buildCommand: npm install --include=dev && npm run build
    # db push runs at START (not build) so the database is reachable and ready —
    # it syncs the schema + pgvector/pgcrypto extensions. Idempotent. Switch to
    # `prisma migrate deploy` once you commit migrations (see RENDER_DEPLOY.md).
    startCommand: npx prisma db push --skip-generate && npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: radar-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      - key: CORS_ORIGIN
        value: '*'
      # Public URL of the PWA — used in password-reset and digest emails.
      # Set this to your Vercel deployment URL (e.g. https://radar-pwa.vercel.app).
      - key: APP_URL
        sync: false
      # Comma-separated emails allowed to access GET /admin/stats.
      - key: ADMIN_EMAILS
        sync: false
      - key: MEDIASTACK_API_KEY
        sync: false

  # Ingestion worker — pulls RSS/podcasts → DeepSeek/Claude editorial engine → feed.
  # Runs every hour; dedup by (source,title) makes re-runs cheap — only new items
  # hit the AI. Content older than 7 days is purged after each run.
  - type: cron
    name: radar-ingest
    runtime: node
    plan: starter
    schedule: '0 * * * *'
    buildCommand: npm install --include=dev && npm run build
    startCommand: node --max-old-space-size=460 dist/jobs/ingest.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: radar-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MEDIASTACK_API_KEY
        sync: false
      # Optional — only needed for YouTube clip ingestion (durations).
      - key: GOOGLE_API_KEY
        sync: false

databases:
  - name: radar-db
    plan: basic-256mb
    postgresMajorVersion: '16'
