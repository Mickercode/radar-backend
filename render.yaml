# Render blueprint for the Radar backend + its Postgres.
# Create via Render dashboard → "New +" → "Blueprint" pointed at this repo.
services:
  - type: web
    name: radar-api
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build && npm run prisma:deploy
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: radar-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGIN
        value: '*'

databases:
  - name: radar-db
    plan: basic-256mb
    postgresMajorVersion: '16'
